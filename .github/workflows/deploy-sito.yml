name: Pubblica il sito su FTP

on:
  push:
    branches: [claude/laughing-hamilton-4o6jud]
    paths:
      - 'sito/**'
      - '.github/workflows/deploy-sito.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sito
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, curl, fileinfo, mbstring, iconv

      # Se un test fallisce il sito NON viene caricato.
      - name: Controllo sintassi PHP
        run: find sito -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test di unità
        run: php sito/tests/unit.php
      - name: Test end-to-end
        run: bash sito/tests/e2e.sh

      - name: Carica sul server FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          # ftps = FTP cifrato (consigliato). Se il tuo hosting non lo supporta,
          # crea la variabile del repository FTP_PROTOCOL con valore "ftp".
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # Cartella di destinazione sul server (variabile FTP_DIR, es. "public_html/"). Default: cartella di login.
          server-dir: ${{ vars.FTP_DIR || './' }}
          local-dir: ./sito/
          # Non toccare mai database e file caricati dall'admin
          exclude: |
            **/.git*
            **/.git*/**
            data/*.sqlite
            data/reset-*.txt
            uploads/pdf/**
            uploads/cover/**
            uploads/thumb/**
            tests/**
            README.md
            ADMIN.md
            importa.php
